name: PRD Review
about: 对 PRD 草案进行质量审查
title: "[PRD Review] "
labels: ["type/prd-review", "status/prd-review", "priority/P1"]
body:
  - type: input
    id: related_issue
    attributes:
      label: 关联需求 / PRD Issue
      description: 填写关联 Issue 链接或编号。
      placeholder: "#12"
    validations:
      required: true
  - type: dropdown
    id: conclusion
    attributes:
      label: Review 结论
      options:
        - 通过
        - 有条件通过
        - 不建议进入开发
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 总体评价
      description: 用 3-5 句话说明这份 PRD 当前质量和主要风险。
    validations:
      required: true
  - type: textarea
    id: issues
    attributes:
      label: 问题点 / 影响 / 修改建议
      description: 每条尽量包含：问题点、影响、修改建议、推荐表述。
      placeholder: |
        1. 问题点：
           影响：
           修改建议：
           推荐表述：
    validations:
      required: true
  - type: textarea
    id: what_how_boundary
    attributes:
      label: What / How 边界检查
      description: 是否混入技术实现、接口字段、建表、Redis、代码块等 How 内容。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准检查
      description: 验收标准是否用户可感知、可验证、无歧义。
    validations:
      required: true
  - type: textarea
    id: next_steps
    attributes:
      label: 下一步
      description: 写清楚谁补什么、补完后进入什么状态。
    validations:
      required: true
