name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - data/labels.json
      - .github/workflows/label-sync.yml
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upsert labels from data/labels.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('data/labels.json', 'utf8'));
            const {owner, repo} = context.repo;
            for (const label of labels) {
              const name = label.name;
              const color = (label.color || 'ededed').replace(/^#/, '');
              const description = label.description || '';
              try {
                await github.rest.issues.updateLabel({owner, repo, name, color, description});
                core.info(`updated label: ${name}`);
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({owner, repo, name, color, description});
                  core.info(`created label: ${name}`);
                } else {
                  throw error;
                }
              }
            }
