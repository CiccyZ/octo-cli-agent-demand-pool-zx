name: Cron scan demand pool

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cron-scan.yml
      - data/labels.json
      - .github/ISSUE_TEMPLATE/**

permissions:
  contents: write
  issues: read

concurrency:
  group: cron-scan-demand-pool
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan issues and update audit log on changes
        id: scan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const normalized = issues
              .filter(i => !i.pull_request)
              .map(i => ({
                number: i.number,
                title: i.title,
                state: i.state,
                labels: i.labels.map(l => typeof l === 'string' ? l : l.name).sort(),
                updated_at: i.updated_at,
                created_at: i.created_at,
                html_url: i.html_url
              }))
              .sort((a, b) => a.number - b.number);
            fs.mkdirSync('data', {recursive: true});
            fs.mkdirSync('logs', {recursive: true});
            const snapshotPath = 'data/issue-snapshot.json';
            const oldRaw = fs.existsSync(snapshotPath) ? fs.readFileSync(snapshotPath, 'utf8') : '';
            const newRaw = JSON.stringify(normalized, null, 2) + '\n';
            const changed = oldRaw !== newRaw;
            const now = new Date().toISOString();
            if (!fs.existsSync('logs/cron-runs.md')) {
              fs.writeFileSync('logs/cron-runs.md', '# 定时扫描记录\n\n| 时间 UTC | 扫描范围 | 结果 | 后续动作 |\n|---|---|---|---|\n');
            }
            if (changed) {
              fs.writeFileSync(snapshotPath, newRaw);
              const summary = normalized.length === 0
                ? 'Issues empty / snapshot initialized'
                : `Detected ${normalized.length} issue(s); snapshot updated`;
              fs.appendFileSync('logs/cron-runs.md', `| ${now} | GitHub Issues / Labels / Comments | ${summary} | Review changed issues and notify exam group if needed |\n`);
              core.info(summary);
            } else {
              core.info('No issue changes detected; no repository commit needed.');
            }
            core.setOutput('changed', changed ? 'true' : 'false');
      - name: Commit scan changes
        if: steps.scan.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/issue-snapshot.json logs/cron-runs.md
          git commit -m "chore: update cron scan snapshot"
          git push
